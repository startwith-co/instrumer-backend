name: instrumer CI/CD

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  # ============================================
  # BUILD: 코드 빌드 및 Docker 이미지 생성
  # ============================================
  build:
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.set-image-name.outputs.name }}
      image-repo: ${{ steps.set-image-name.outputs.repo }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: '17'

      - name: Set Image Name
        id: set-image-name
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "name=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_OUTPUT
            echo "repo=instrumer-develop" >> $GITHUB_OUTPUT
          else
            echo "name=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_OUTPUT
            echo "repo=instrumer-prod" >> $GITHUB_OUTPUT
          fi

      - name: Set YML for DEVELOP
        if: github.ref == 'refs/heads/develop'
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML_TEST }}" | base64 --decode > src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_TEST_YML }}" | base64 --decode > src/main/resources/application-test.yml

      - name: Set YML for PRODUCTION
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML_PRODUCTION }}" | base64 --decode > src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PRODUCTION_YML }}" | base64 --decode > src/main/resources/application-production.yml

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        env:
          NAME: ${{ steps.set-image-name.outputs.name }}
          REPO: ${{ steps.set-image-name.outputs.repo }}
        run: |
          docker build -t $REPO .
          docker tag $REPO:latest $NAME/$REPO:latest
          docker push $NAME/$REPO:latest

  # ============================================
  # DEPLOY: 테스트 서버 배포
  # ============================================
  deploy-test:
    needs: build
    runs-on: [self-hosted, test]
    if: github.ref == 'refs/heads/develop'
    name: Deploy to Test Server

    steps:
      # 권한 설정
      - name: Setup Permissions
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} || true

      # Docker 인증
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Docker 정리
      - name: Clean up Docker
        run: |
          sudo docker container prune -f || true
          sudo docker image prune -a -f || true
          sudo docker volume prune -f || true
          sudo docker network prune -f || true

      # 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 배포
      - name: Deploy Application
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # 최신 이미지 pull
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/instrumer-develop:latest
          
          # 프로젝트 디렉토리로 이동
          cd ${{ github.workspace }}
          
          # .env 파일 생성
          cat > .env << EOF
          MYSQL_DATABASE=instrumer
          MYSQL_USER=instrumer
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          EOF
          
          # Docker Compose로 배포
          sudo docker compose down || true
          sudo docker compose up -d

  # ============================================
  # DEPLOY: 운영 서버 배포
  # ============================================
  deploy-prod:
    needs: build
    runs-on: [self-hosted, prod]
    if: github.ref == 'refs/heads/master'
    name: Deploy to Production Server

    steps:
      # 권한 설정
      - name: Setup Permissions
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} || true

      # Docker 인증
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Docker 정리
      - name: Clean up Docker
        run: |
          sudo docker container prune -f || true
          sudo docker image prune -a -f || true
          sudo docker volume prune -f || true
          sudo docker network prune -f || true

      # 배포
      - name: Deploy Application
        run: |
          # 기존 컨테이너 종료 및 삭제
          sudo docker ps -q --filter "name=instrumer-prod" | grep -q . && \
            sudo docker stop instrumer-prod && sudo docker rm instrumer-prod || true

          # 최신 이미지 pull 및 실행
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/instrumer-prod:latest
          sudo docker run -d --name instrumer-prod --rm --network host \
            ${{ secrets.DOCKER_USERNAME }}/instrumer-prod:latest
