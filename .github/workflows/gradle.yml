name: instrumer CI/CD

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: '17'

      # DEVELOP 용 YML
      - name: Set YML for DEVELOP
        if: github.ref == 'refs/heads/develop'
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML_TEST }}" | base64 --decode > src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_TEST_YML }}" | base64 --decode > src/main/resources/application-test.yml

      # PRODUCTION 용 YML
      - name: Set YML for PRODUCTION
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML_PRODUCTION }}" | base64 --decode > src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PRODUCTION_YML }}" | base64 --decode > src/main/resources/application-production.yml

      # Gradle Build
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      # DockerHub Login (빌드 러너)
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # DEVELOP 이미지 빌드/푸시
      - name: Build and Push Docker Image (DEVELOP)
        if: github.ref == 'refs/heads/develop'
        env:
          NAME: ${{ secrets.DOCKER_USERNAME }}
          REPO: instrumer-develop
        run: |
          docker build -t $REPO .
          docker tag $REPO:latest $NAME/$REPO:latest
          docker push $NAME/$REPO:latest

      # PROD 이미지 빌드/푸시
      - name: Build and Push Docker Image (PRODUCTION)
        if: github.ref == 'refs/heads/master'
        env:
          NAME: ${{ secrets.DOCKER_USERNAME }}
          REPO: instrumer-prod
        run: |
          docker build -t $REPO .
          docker tag $REPO:latest $NAME/$REPO:latest
          docker push $NAME/$REPO:latest

  # 테스트 서버 배포 (self-hosted runner: label = test)
  deploy-test:
    needs: build
    runs-on: [self-hosted, test]
    if: github.ref == 'refs/heads/develop'
    name: Deploy to Test Server (Self-hosted Runner)

    steps:
      - name: Docker login (on TEST EC2)
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Clean up Docker to free space
        run: |
          sudo docker container prune -f || true
          sudo docker image prune -a -f || true
          sudo docker volume prune -f || true
          sudo docker network prune -f || true

      - name: Deploy to Test Server
        run: |
          # 기존 컨테이너 종료 및 삭제
          sudo docker ps -q --filter "name=instrumer-develop" | grep -q . && \
            sudo docker stop instrumer-develop && sudo docker rm instrumer-develop || true

          # 최신 이미지 pull 및 실행
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/instrumer-develop:latest
          sudo docker run -d --name instrumer-develop --rm -p 8080:8080 \
            ${{ secrets.DOCKER_USERNAME }}/instrumer-develop:latest

  # 운영 서버 배포 (self-hosted runner: label = prod) – 나중에 러너 붙이면 사용
  deploy-prod:
    needs: build
    runs-on: [self-hosted, prod]
    if: github.ref == 'refs/heads/master'
    name: Deploy to Production Server (Self-hosted Runner)

    steps:
      - name: Docker login (on PROD EC2)
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Clean up Docker to free space
        run: |
          sudo docker container prune -f || true
          sudo docker image prune -a -f || true
          sudo docker volume prune -f || true
          sudo docker network prune -f || true

      - name: Deploy to Production Server
        run: |
          # 기존 컨테이너 종료 및 삭제
          sudo docker ps -q --filter "name=instrumer-prod" | grep -q . && \
            sudo docker stop instrumer-prod && sudo docker rm instrumer-prod || true

          # 최신 이미지 pull 및 실행
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/instrumer-prod:latest
          sudo docker run -d --name instrumer-prod --rm -p 8080:8080 \
            ${{ secrets.DOCKER_USERNAME }}/instrumer-prod:latest